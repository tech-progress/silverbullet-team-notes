services:
  app:
    build: .
    environment:
      SB_ADMIN_USER: ${SB_ADMIN_USER:-admin}
      SB_ADMIN_PASSWORD: ${SB_ADMIN_PASSWORD:?Set SB_ADMIN_PASSWORD}
      SB_PORT: "3000"
      SB_HOSTNAME: "::"
      SB_FOLDER: /data
      PUID: "1000"
      PGID: "1000"
    ports: ["127.0.0.1:${LOCAL_PORT:-18320}:3000"]
    volumes: ["notes:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/.instance"]
      interval: 5s
      timeout: 3s
      retries: 60
volumes:
  notes:
